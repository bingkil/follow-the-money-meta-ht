[project]
name = "follow-the-money"
version = "0.1.0"
description = "Evidence-grounded financial investigation"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["services/api"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
